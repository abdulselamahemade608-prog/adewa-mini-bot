<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ADEWA Mini Bot</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 18px 16px 30px;
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1677ff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .welcome {
            font-size: 13px;
            color: #788398;
            margin-bottom: 3px;
        }

        .name {
            font-size: 18px;
            font-weight: 700;
        }

        .bot-title {
            font-size: 13px;
            font-weight: 700;
            color: #1677ff;
        }

        /* BALANCE */

        .balance-card {
            background: linear-gradient(135deg, #1677ff, #1554d1);
            color: white;
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 10px 25px rgba(21, 84, 209, 0.20);
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.85;
        }

        .balance {
            font-size: 34px;
            font-weight: 800;
            margin-top: 7px;
        }

        .balance-sub {
            margin-top: 8px;
            font-size: 13px;
            opacity: 0.8;
        }

        /* QUICK STATS */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 17px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .stat-icon {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .stat-title {
            color: #7a8598;
            font-size: 12px;
        }

        .stat-value {
            font-size: 19px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* SECTION */

        .section-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        /* ACTIONS */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action {
            border: none;
            background: white;
            border-radius: 18px;
            padding: 18px 14px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.12s ease;
        }

        .action:active {
            transform: scale(0.97);
        }

        .action-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
            background: #eef4ff;
        }

        .action-title {
            font-weight: 750;
            font-size: 15px;
        }

        .action-description {
            color: #8490a3;
            font-size: 11px;
            margin-top: 4px;
        }

        /* FULL BUTTON */

        .withdraw {
            width: 100%;
            border: none;
            margin-top: 12px;
            padding: 16px;
            border-radius: 16px;
            background: #172033;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .withdraw:active {
            transform: scale(0.98);
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #98a1b1;
            font-size: 11px;
        }

        /* MOBILE */

        @media (max-width: 360px) {
            .app {
                padding: 14px 12px 25px;
            }

            .balance {
                font-size: 30px;
            }

            .action {
                padding: 15px 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="user-area">

            <div class="avatar" id="avatar">
                U
            </div>

            <div>
                <div class="welcome">
                    Welcome back
                </div>

                <div class="name" id="userName">
                    User
                </div>
            </div>

        </div>

        <div class="bot-title">
            ADEWA
        </div>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

        <div class="balance-label">
            💰 Available Balance
        </div>

        <div class="balance">
            <span id="balance">0.00</span> Birr
        </div>

        <div class="balance-sub">
            Keep earning and grow your balance.
        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <div class="stat-title">
                Referrals
            </div>

            <div class="stat-value" id="referrals">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ✅
            </div>

            <div class="stat-title">
                Tasks Completed
            </div>

            <div class="stat-value" id="tasks">
                0
            </div>

        </div>

    </div>


    <!-- EARNING METHODS -->

    <div class="section-title">
        Earn Money
    </div>


    <div class="actions">

        <!-- ADS -->

        <button class="action" onclick="watchAds()">

            <div class="action-icon">
                📺
            </div>

            <div class="action-title">
                Watch Ads
            </div>

            <div class="action-description">
                Watch advertisements
            </div>

        </button>


        <!-- TASKS -->

        <button class="action" onclick="openTasks()">

            <div class="action-icon">
                📋
            </div>

            <div class="action-title">
                Tasks
            </div>

            <div class="action-description">
                Complete available tasks
            </div>

        </button>


        <!-- REFERRAL -->

        <button class="action" onclick="inviteFriends()">

            <div class="action-icon">
                👥
            </div>

            <div class="action-title">
                Invite Friends
            </div>

            <div class="action-description">
                Earn from referrals
            </div>

        </button>


        <!-- HISTORY -->

        <button class="action" onclick="openHistory()">

            <div class="action-icon">
                📊
            </div>

            <div class="action-title">
                History
            </div>

            <div class="action-description">
                View transactions
            </div>

        </button>

    </div>


    <!-- WITHDRAW -->

    <button class="withdraw" onclick="withdraw()">
        💳 Withdraw
    </button>


    <!-- FOOTER -->

    <div class="footer">
        ADEWA Mini Bot • Secure Rewards
    </div>

</div>

<script>

    // ==========================================
    // TELEGRAM WEB APP
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // BACKEND API
    // ==========================================

    const API_URL = "https://adewa-mini-backend.vercel.app";


    // ==========================================
    // TELEGRAM USER
    // ==========================================

    const user = tg.initDataUnsafe?.user;


    // ==========================================
    // DISPLAY USER
    // ==========================================

    if (user) {

        const firstName = user.first_name || "User";

        document.getElementById("userName").textContent =
            firstName;

        const firstLetter =
            firstName.charAt(0).toUpperCase();

        document.getElementById("avatar").textContent =
            firstLetter;
    }


    // ==========================================
    // LOAD USER FROM BACKEND
    // ==========================================

    async function loadUser() {

        try {

            // Telegram must provide initData.
            if (!tg.initData) {

                tg.showAlert(
                    "Please open this Mini App from Telegram."
                );

                return;
            }


            const response = await fetch(
                API_URL + "/api/me",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        initData: tg.initData
                    })
                }
            );


            const data = await response.json();


            // ======================================
            // BACKEND ERROR
            // ======================================

            if (!response.ok || !data.success) {

                console.error(
                    "Backend error:",
                    data
                );

                tg.showAlert(
                    data.error ||
                    "Unable to load your account."
                );

                return;
            }


            // ======================================
            // USER DATA
            // ======================================

            const account = data.user;


            // ======================================
            // BALANCE
            // ======================================

            document.getElementById("balance").textContent =
                Number(account.balance).toFixed(2);


            // ======================================
            // REFERRALS
            // ======================================

            document.getElementById("referrals").textContent =
                account.referral_count;


            // ======================================
            // TASKS
            // ======================================

            document.getElementById("tasks").textContent =
                account.tasks_completed;


            // ======================================
            // NAME
            // ======================================

            if (account.first_name) {

                document.getElementById("userName").textContent =
                    account.first_name;

                document.getElementById("avatar").textContent =
                    account.first_name
                        .charAt(0)
                        .toUpperCase();
            }


            console.log(
                "Account loaded:",
                account
            );

        } catch (error) {

            console.error(
                "Connection error:",
                error
            );

            tg.showAlert(
                "Could not connect to the server."
            );
        }
    }


    // ==========================================
    // WATCH ADS
    // ==========================================

    function watchAds() {

        tg.showAlert(
            "Ads system will be connected next."
        );
    }


    // ==========================================
    // TASKS
    // ==========================================

    function openTasks() {

        tg.showAlert(
            "Task system will be connected next."
        );
    }


    // ==========================================
    // INVITE FRIENDS
    // ==========================================

    function inviteFriends() {

        if (!user) {

            tg.showAlert(
                "Telegram user information is unavailable."
            );

            return;
        }


        const referralLink =
            "https://t.me/M_r_work2bot?start=ref_" +
            user.id;


        // Telegram share dialog
        const shareUrl =
            "https://t.me/share/url?url=" +
            encodeURIComponent(referralLink) +
            "&text=" +
            encodeURIComponent(
                "Join ADEWA Mini Bot and start earning!"
            );


        tg.openTelegramLink(shareUrl);
    }


    // ==========================================
    // HISTORY
    // ==========================================

    function openHistory() {

        tg.showAlert(
            "Transaction history will be connected next."
        );
    }


    // ==========================================
    // WITHDRAW
    // ==========================================

    function withdraw() {

        tg.showAlert(
            "Withdrawal system will be connected next."
        );
    }


    // ==========================================
    // START
    // ==========================================

    loadUser();

</script>

</body>
</html>
